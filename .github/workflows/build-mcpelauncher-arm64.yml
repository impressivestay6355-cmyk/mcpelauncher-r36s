name: build-mcpelauncher-arm64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ clang cmake ninja-build git ca-certificates make pkg-config \
            libssl-dev libpng-dev libx11-dev libxi-dev libcurl4-openssl-dev \
            libudev-dev libevdev-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libgbm-dev libdrm-dev zlib1g-dev \
            qtbase5-dev qtwebengine5-dev qtdeclarative5-dev libqt5svg5-dev \
            qml-module-qtquick2 qml-module-qtquick-layouts \
            qml-module-qtquick-controls qml-module-qtquick-controls2 \
            qml-module-qtquick-window2 qml-module-qtquick-dialogs \
            qml-module-qt-labs-settings qml-module-qt-labs-folderlistmodel \
            qml-module-qtwebengine

      - name: Clone mcpelauncher-manifest
        run: git clone --recursive --branch v1.7.2 https://github.com/minecraft-linux/mcpelauncher-manifest.git src

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p src/build
          cmake -S src -B src/build -G Ninja \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DJNI_USE_JNIVM=ON

      - name: Build
        run: cmake --build src/build -j$(nproc)

      - name: Collect output
        run: |
          mkdir -p out/mcpelauncher/lib/arm64-v8a
          mkdir -p out/lib/arm64-v8a
          mkdir -p out/lib/arm64-system

          find src/build -type f -name "mcpelauncher-client" -exec cp {} out/mcpelauncher/ \;
          find src/build -type f \( -name "libc.so" -o -name "libm.so" \) -exec cp {} out/mcpelauncher/lib/arm64-v8a/ \;
          find src/build -type f -name "libc++_shared.so" -exec cp {} out/lib/arm64-v8a/ \;
          find src/build -type f -name "libgbm.so*" -exec cp {} out/lib/arm64-v8a/ \;
          cp -Ln /usr/lib/aarch64-linux-gnu/libgbm.so* out/lib/arm64-v8a/ 2>/dev/null || true

          ldd out/mcpelauncher/mcpelauncher-client | awk '{print $3}' | grep '^/' | while read -r f; do
            cp -Ln "$f" out/lib/arm64-system/ 2>/dev/null || true
          done

          for pass in 1 2 3; do
            for so in out/lib/arm64-v8a/*.so* out/lib/arm64-system/*.so*; do
              [ -f "$so" ] || continue
              ldd "$so" 2>/dev/null | awk '{print $3}' | grep '^/' | while read -r dep; do
                base=$(basename "$dep")
                [ -f "out/lib/arm64-system/$base" ] || [ -f "out/lib/arm64-v8a/$base" ] || cp -Ln "$dep" out/lib/arm64-system/ 2>/dev/null || true
              done
            done
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcpelauncher-client-arm64
          path: out
